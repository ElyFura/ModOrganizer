name: Release

# Zwei Wege zum selben Ergebnis:
#   - Tag v1.2.0 pushen        -> Tag muss zur <Version> passen, sonst Abbruch
#   - Workflow von Hand starten -> nimmt die <Version> aus dem csproj als Tag
#
# Der zweite Weg existiert, weil ein Tag-Push nichts ausloest, solange Actions fuer das
# Repository noch nicht aktiv war - dann laesst sich das Release nachtraeglich anstossen,
# ohne den Tag loeschen und neu setzen zu muessen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content src/ModOrganizer.App/ModOrganizer.App.csproj)
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) -join ''
          if (-not $version) { throw "Keine <Version> in ModOrganizer.App.csproj gefunden." }

          # Bei einem Tag-Push muss der Tag zur Version passen. Sonst haelt sich die
          # veroeffentlichte exe fuer aktuell und niemand bekaeme je wieder ein Update.
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            if ($tag -ne $version) {
              throw "Tag $tag passt nicht zu <Version>$version</Version>."
            }
          }

          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Release-Version: $version"

      - name: Tests
        run: dotnet test src/ModOrganizer.Core.Tests/ModOrganizer.Core.Tests.csproj -c Release --nologo

      - name: Veroeffentlichen
        run: dotnet publish src/ModOrganizer.App/ModOrganizer.App.csproj -c Release -o publish --nologo

      - name: Pruefsumme
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ModOrganizer.App.exe -Algorithm SHA256).Hash
          "$hash  ModOrganizer.App.exe" | Out-File publish/ModOrganizer.App.exe.sha256 -Encoding ascii
          Write-Host $hash

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            publish/ModOrganizer.App.exe
            publish/ModOrganizer.App.exe.sha256
          generate_release_notes: true
